name: Master E2E Test Suite (All 4 Tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  setup-node:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        run: echo "Initializing test environments..."

  selenium-tests:
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd coordcamp-web
          npm install
          node selenium-tests/tests/login-tests.js
      - uses: actions/upload-artifact@v4
        with:
          name: Selenium_Report
          path: coordcamp-web/Selenium_Login_Execution_Report.xlsx

  appium-tests:
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd coordcamp-android
          npm install
          node appium-tests/app-tests.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Appium_Report
          path: coordcamp-android/Appium_Mobile_Execution_Report.xlsx

  load-tests:
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd coordcamp-web
          npm install
          node load-test.js
      - uses: actions/upload-artifact@v4
        with:
          name: Load_Testing_Report
          path: coordcamp-web/Load_Testing_Execution_Report.xlsx

  security-assessment:
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd coordcamp-web
          npm install xlsx
          node security-tests/generate-security-reports.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Security_Reports
          path: coordcamp-web/Vulnerability Test Results/

  summary:
    needs: [selenium-tests, appium-tests, load-tests, security-assessment]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ALL_TEST_REPORTS
      - name: Bundle Master Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Complete_Master_Test_Reports
          path: ALL_TEST_REPORTS/
      - name: Publish Summary
        run: |
          echo "## 🚀 Master Test Suite Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "All parallel test nodes have finished. Download the \`Complete_Master_Test_Reports\` artifact to view all generated Excel spreadsheets and Markdown reports." >> $GITHUB_STEP_SUMMARY
